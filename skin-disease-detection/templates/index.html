{% extends "base.html" %}
{% block title %}AI Skin Disease Detector{% endblock %}
{% block content %}
  <main class="container" style="margin-top:120px;">
    <h1>🩺 AI Skin Disease Detector</h1>
    <p class="subtitle">Upload a skin image to analyze and detect disease type.</p>

    <form action="{{ url_for('predict') }}" method="POST" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/png,image/jpeg" required>
      <button type="submit">Analyze</button>
    </form>

    <p class="disclaimer">⚠️ Educational project only. Not a medical diagnosis — please consult a dermatologist.</p>
  </main>
{% endblock %}
